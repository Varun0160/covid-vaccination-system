spring.application.name=covid-vaccination-system

server.port=1010

# Database connection (MySQL in Docker, port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/vaccine_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:vaccine_pass}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-ms=3600000

# Seeded admin account
app.admin.email=admin@vaccine.com
app.admin.password=${ADMIN_PASSWORD:Admin@123}